
name: Project Echo Android APK build

on:
  workflow_dispatch:
  push:
    paths:
      - "THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Project Echo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android builder project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER.zip"
          BUILDER="android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Builder ZIP not found: $ZIP"
            exit 1
          fi

          mkdir -p android-builder
          unzip -q "$ZIP" -d android-builder

          if [ ! -f "$BUILDER/game/main.py" ]; then
            echo "::error::Builder game/main.py was not found"
            find android-builder -maxdepth 5 -type f | head -100
            exit 1
          fi

          if [ ! -f "$BUILDER/android/build.gradle" ]; then
            echo "::error::Android build.gradle was not found"
            exit 1
          fi

          echo "Android builder project extracted successfully."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Python game for browser runtime
        working-directory: android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pygbag

          # Do not use the obsolete noctx.tmpl template.
          python -m pygbag --build --PYBUILD 3.12 --ume_block=0 game

          if [ ! -d game/build/web ]; then
            echo "::error::Pygbag did not create game/build/web"
            exit 1
          fi

          if [ -z "$(find game/build/web -type f -print -quit)" ]; then
            echo "::error::Browser build is empty"
            exit 1
          fi

          echo "Pygbag build completed."

      - name: Copy browser files into Android assets
        shell: bash
        run: |
          set -euo pipefail

          BUILDER="android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER"
          SOURCE="$BUILDER/game/build/web"
          DEST="$BUILDER/android/app/src/main/assets/game"

          if [ ! -d "$SOURCE" ]; then
            echo "::error::Browser build directory is missing"
            exit 1
          fi

          mkdir -p "$DEST"
          cp -a "$SOURCE/." "$DEST/"

          if [ -z "$(find "$DEST" -type f -print -quit)" ]; then
            echo "::error::No browser files were copied"
            exit 1
          fi

          echo "Android web assets copied."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail

          SDK="$HOME/android-sdk"
          TOOLS_DIR="$SDK/cmdline-tools"
          DOWNLOAD_DIR="$RUNNER_TEMP/android-command-line-tools"

          # Install into a known location rather than relying on
          # an Android SDK preinstalled on the GitHub runner.
          mkdir -p "$TOOLS_DIR" "$DOWNLOAD_DIR"

          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            --output "$DOWNLOAD_DIR/commandlinetools.zip"

          unzip -q "$DOWNLOAD_DIR/commandlinetools.zip" \
            -d "$DOWNLOAD_DIR"

          mkdir -p "$TOOLS_DIR/latest"
          cp -a "$DOWNLOAD_DIR/cmdline-tools/." "$TOOLS_DIR/latest/"

          SDKMANAGER="$TOOLS_DIR/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager installation failed"
            exit 1
          fi

          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "$TOOLS_DIR/latest/bin"
            echo "$SDK/platform-tools"
          } >> "$GITHUB_ENV"

          echo "Android command-line tools installed."

      - name: Accept licenses and install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          # Accept the SDK licenses.
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            || true

          # Install only the packages needed for this build.
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Required Android SDK packages installed."

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          test -x "$SDK/platform-tools/adb" || {
            echo "::error::Android platform-tools are missing"
            exit 1
          }

          test -d "$SDK/platforms/android-35" || {
            echo "::error::Android API 35 is missing"
            exit 1
          }

          test -d "$SDK/build-tools/35.0.0" || {
            echo "::error::Android build-tools are missing"
            exit 1
          }

          echo "Android SDK verification passed."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          BUILDER="android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER"

          gradle --no-daemon --stacktrace \
            -p "$BUILDER/android" assembleDebug

          APK="$BUILDER/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::Gradle finished without creating the expected APK"
            find "$BUILDER/android" -path '*outputs*apk*' -type f
            exit 1
          fi

          mkdir -p output
          cp "$APK" output/project-echo-debug.apk

          echo "APK created successfully."

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-echo-android-debug-apk
          path: output/project-echo-debug.apk
          if-no-files-found: error
          retention-days: 14
