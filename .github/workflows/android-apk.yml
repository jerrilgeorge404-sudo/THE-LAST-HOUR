
name: Project Echo Android APK build

on:
  workflow_dispatch:
  push:
    paths:
      - "THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER.zip"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Project Echo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android builder project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER.zip"
          BUILDER="android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER"

          test -f "$ZIP" || {
            echo "::error::Builder ZIP not found: $ZIP"
            exit 1
          }

          mkdir -p android-builder
          unzip -q "$ZIP" -d android-builder

          test -f "$BUILDER/game/main.py" || {
            echo "::error::Builder game/main.py was not found"
            find android-builder -maxdepth 5 -type f | head -100
            exit 1
          }

          test -f "$BUILDER/android/build.gradle" || {
            echo "::error::Android build.gradle was not found"
            exit 1
          }

          echo "Builder project extracted."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Python game for browser runtime
        working-directory: android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip pygbag
          python -m pygbag --build --PYBUILD 3.12 --ume_block=0 game

          test -d game/build/web || {
            echo "::error::Pygbag did not create game/build/web"
            exit 1
          }

          test -n "$(find game/build/web -type f -print -quit)" || {
            echo "::error::Browser build is empty"
            exit 1
          }

      - name: Copy browser files into Android assets
        shell: bash
        run: |
          set -euo pipefail

          BUILDER="android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER"
          SOURCE="$BUILDER/game/build/web"
          DEST="$BUILDER/android/app/src/main/assets/game"

          mkdir -p "$DEST"
          cp -a "$SOURCE/." "$DEST/"

          test -n "$(find "$DEST" -type f -print -quit)" || {
            echo "::error::No browser files copied"
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager is not installed on this runner."
            echo "Install Android command-line tools before continuing."
            exit 1
          fi

          echo "Android SDK path: $SDK"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"

          test -x "$SDK/platform-tools/adb" || {
            echo "::error::Android platform-tools are missing"
            exit 1
          }

          test -d "$SDK/platforms/android-35" || {
            echo "::error::Android API 35 is missing"
            exit 1
          }

          test -d "$SDK/build-tools/35.0.0" || {
            echo "::error::Android build-tools are missing"
            exit 1
          }

          echo "Android SDK verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          BUILDER="android-builder/THE_LAST_HOUR_PROJECT_ECHO_ANDROID_APK_BUILDER"

          gradle --no-daemon --stacktrace \
            -p "$BUILDER/android" assembleDebug

          APK="$BUILDER/android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK" || {
            echo "::error::APK was not created"
            find "$BUILDER/android" -path '*outputs*apk*' -type f
            exit 1
          }

          mkdir -p output
          cp "$APK" output/project-echo-debug.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: project-echo-android-debug-apk
          path: output/project-echo-debug.apk
          if-no-files-found: error
          retention-days: 14
